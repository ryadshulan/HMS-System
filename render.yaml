services:
  - type: web
    name: hms-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PUBLIC_BASE_URL
        value: https://hmstar.net
      - key: APP_TIMEZONE
        value: Asia/Aden
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: hms
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: META_GRAPH_VERSION
        value: v24.0
      - key: META_APP_SECRET
        sync: false
      - key: FACEBOOK_PAGE_ID
        value: 107738988661891
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_NEWS_LIMIT
        value: 10
      - key: FACEBOOK_NEWS_CACHE_SECONDS
        value: 120
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        value: hello
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en
      - key: WHATSAPP_TEMPLATE_BODY_PARAMETERS
        value: ""
      - key: WHATSAPP_DELIVERY_MESSAGE
        value: وصلت شحنتك إلى مستودعات عدن بنجاح، شكراً لتعاملكم معنا.
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: 967
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: hms
