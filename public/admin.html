<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<style>
body{font-family:sans-serif;background:#f4f8fb}
.card{background:#fff;padding:15px;margin:10px}
.milestone{padding:5px;margin:3px;border-radius:5px}
.done{background:#d4edda}
.pending{background:#eee}
</style>
</head>

<body>

<div id="login">
<h3>Login</h3>
<input id="user"><br><br>
<input id="pass" type="password"><br><br>
<button onclick="login()">Login</button>
</div>

<div id="app" style="display:none">

<div class="card">
<h3>Shipment</h3>
<input id="track"><br>
<select id="status">
<option>Loading at Origin Warehouse</option>
<option>Gated-in at Ningbo Port</option>
<option>Loaded on Board</option>
<option>Arrived at Aden</option>
<option>Customs Cleared</option>
<option>Delivered to Aden Warehouse</option>
</select><br>
<button onclick="save()">Save</button>
</div>

<div class="card">
<table id="table"></table>
</div>

<div class="card">
<h3>Client</h3>
<input id="name">
<input id="container">
<input id="phone">
<button onclick="addClient()">Add</button>
</div>

<div class="card">
<table id="ctable"></table>
</div>

</div>

<script>

async function login(){
 const res = await fetch('/api/login',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
   username:user.value,
   password:pass.value
  })
 });

 const data = await res.json();
 if(data.success){
  login.style.display='none';
  app.style.display='block';
  load();
 }else alert("خطأ");
}

// ===== shipments
async function save(){
 await fetch('/api/shipment',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
   trackingNumber:track.value,
   status:status.value
  })
 });
 load();
}

async function load(){
 const res = await fetch('/api/shipments');
 const data = await res.json();

 table.innerHTML="";
 data.forEach(s=>{
  table.innerHTML+=`
  <tr>
   <td>${s.id}</td>
   <td>${s.status}</td>
   <td>${milestones(s.status)}</td>
  </tr>`;
 });

 loadClients();
}

function milestones(status){
 const steps=[
 "Loading at Origin Warehouse",
 "Gated-in at Ningbo Port",
 "Loaded on Board",
 "Arrived at Aden",
 "Customs Cleared",
 "Delivered to Aden Warehouse"
 ];
 let i=steps.indexOf(status);
 return steps.map((s,idx)=>`<div class="milestone ${idx<=i?'done':'pending'}">${s}</div>`).join('');
}

// ===== clients
async function addClient(){
 await fetch('/api/clients',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({
   name:name.value,
   container:container.value,
   phone:phone.value
  })
 });
 loadClients();
}

async function loadClients(){
 const res = await fetch('/api/clients');
 const data = await res.json();

 ctable.innerHTML="";
 data.forEach(c=>{
  ctable.innerHTML+=`
  <tr>
   <td>${c.name}</td>
   <td>${c.container}</td>
   <td>${c.phone}</td>
  </tr>`;
 });
}

</script>

</body>
</html>
