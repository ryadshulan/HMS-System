<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة النجم الحديث</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2b5c6a; --secondary: #f16736; }
        body { font-family: 'Tajawal', sans-serif; margin: 0; display: flex; background: #f0f4f7; }
        .sidebar { width: 220px; background: var(--primary); color: white; min-height: 100vh; padding: 20px; position: fixed; }
        .sidebar li { list-style: none; padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 5px; }
        .sidebar li:hover, .active { background: var(--secondary); }
        .main { margin-right: 260px; padding: 20px; width: 100%; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select { padding: 10px; margin: 5px; border: 1px solid #ddd; border-radius: 5px; width: 200px; }
        button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; background: var(--primary); color: white; }
        .milestone-row { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; align-items: center; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: center; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>النجم الحديث HMS</h3>
        <li onclick="show('tracking')" id="btn-tracking" class="active">التتبع</li>
        <li onclick="show('customers')" id="btn-customers">العملاء</li>
    </div>

    <div class="main">
        <section id="tracking">
            <div class="card">
                <h3>تحديث حالة حاوية</h3>
                <input type="text" id="containerID" placeholder="رقم الحاوية">
                <button onclick="saveShipment()">حفظ التحديث</button>
                <hr>
                <div id="m-list">
                    <div class="milestone-row"><span>1. مخازن الصين</span><select id="m1"><option value="pending">جاري</option><option value="completed">تم</option></select></div>
                    <div class="milestone-row"><span>2. ميناء نينغبو</span><select id="m2"><option value="pending">جاري</option><option value="completed">تم</option></select></div>
                    <div class="milestone-row"><span>3. التحميل للباخرة</span><select id="m3"><option value="pending">جاري</option><option value="completed">تم</option></select></div>
                    <div class="milestone-row"><span>4. وصول عدن</span><select id="m4"><option value="pending">جاري</option><option value="completed">تم</option></select></div>
                    <div class="milestone-row"><span>5. التخليص الجمركي</span><select id="m5"><option value="pending">جاري</option><option value="completed">تم</option></select></div>
                    <div class="milestone-row"><span>6. مستودع عدن</span><select id="m6"><option value="pending">جاري</option><option value="completed">تم</option></select></div>
                </div>
            </div>
        </section>

        <section id="customers" style="display:none">
            <div class="card">
                <h3>إضافة عميل</h3>
                <input type="text" id="cName" placeholder="الاسم">
                <input type="text" id="cPhone" placeholder="الهاتف">
                <input type="text" id="cID" placeholder="الحاوية">
                <button onclick="addCustomer()">إضافة</button>
            </div>
            <div class="card">
                <button onclick="window.open('/api/customers/export')" style="background:#27ae60">تصدير CSV</button>
                <table><thead><tr><th>الاسم</th><th>الهاتف</th><th>الحاوية</th></tr></thead><tbody id="cTable"></tbody></table>
            </div>
        </section>
    </div>

    <script>
        function show(id) {
            document.getElementById('tracking').style.display = id === 'tracking' ? 'block' : 'none';
            document.getElementById('customers').style.display = id === 'customers' ? 'block' : 'none';
            document.getElementById('btn-tracking').classList.toggle('active', id === 'tracking');
            document.getElementById('btn-customers').classList.toggle('active', id === 'customers');
            if(id === 'customers') loadCustomers();
        }

        async function saveShipment() {
            const trackingNumber = document.getElementById('containerID').value;
            const milestones = { m1: document.getElementById('m1').value, m2: document.getElementById('m2').value, m3: document.getElementById('m3').value, m4: document.getElementById('m4').value, m5: document.getElementById('m5').value, m6: document.getElementById('m6').value };
            await fetch('/api/shipment', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({trackingNumber, milestones})});
            alert('تم الحفظ');
        }

        async function addCustomer() {
            const data = { name: document.getElementById('cName').value, phone: document.getElementById('cPhone').value, containerId: document.getElementById('cID').value };
            await fetch('/api/customers', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)});
            loadCustomers();
        }

        async function loadCustomers() {
            const res = await fetch('/api/customers');
            const data = await res.json();
            document.getElementById('cTable').innerHTML = data.map(c => `<tr><td>${c.name}</td><td>${c.phone}</td><td>${c.containerId}</td></tr>`).join('');
        }
    </script>
</body>
</html>
