<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | النجم الحديث</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2b5c6a; --secondary: #f16736; --bg: #f4f8fb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .admin-container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); text-align: center; }
        
        .form-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: #f9f9f9; padding: 20px; border-radius: 10px; }
        input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-family: inherit; }
        .full-width { grid-column: span 2; }
        
        .milestone-setter { grid-column: span 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 8px; }
        .milestone-setter label { font-size: 0.9rem; display: flex; align-items: center; gap: 5px; cursor: pointer; }

        button.save-btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button.save-btn:hover { background: #1e434d; }

        .shipment-list { margin-top: 40px; border-collapse: collapse; width: 100%; }
        .shipment-list th, .shipment-list td { padding: 12px; text-align: right; border-bottom: 1px solid #eee; }
        .shipment-list th { background: var(--primary); color: white; }
        
        .status-badge { padding: 4px 8px; border-radius: 50px; font-size: 0.8rem; background: #eee; }
        .delete-btn { color: #e74c3c; cursor: pointer; border: none; background: none; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1><i class="fas fa-tasks"></i> إدارة الشحنات والمراحل</h1>

    <div class="form-group">
        <input type="text" id="trackId" placeholder="رقم الشحنة (مثال: HMSU-101)" class="full-width">
        <input type="text" id="currentLocation" placeholder="الموقع الحالي (مثال: ميناء نينغبو)">
        <select id="generalStatus">
            <option value="في الانتظار">في الانتظار</option>
            <option value="قيد الشحن">قيد الشحن</option>
            <option value="وصلت">وصلت</option>
        </select>
        
        <div class="milestone-setter">
            <strong class="full-width">تحديد المراحل المكتملة:</strong>
            <label><input type="checkbox" id="m1"> مخازن الصين</label>
            <label><input type="checkbox" id="m2"> ميناء نينغبو</label>
            <label><input type="checkbox" id="m3"> التحميل للباخرة</label>
            <label><input type="checkbox" id="m4"> وصول عدن</label>
            <label><input type="checkbox" id="m5"> التخليص الجمركي</label>
            <label><input type="checkbox" id="m6"> مستودع عدن</label>
        </div>

        <button onclick="saveShipment()" class="save-btn full-width">حفظ الشحنة وتحديث المراحل</button>
    </div>

    <hr>

    <table class="shipment-list">
        <thead>
            <tr>
                <th>رقم الشحنة</th>
                <th>الموقع</th>
                <th>المراحل المكتملة</th>
                <th>إجراءات</th>
            </tr>
        </thead>
        <tbody id="shipmentsTable">
            </tbody>
    </table>
</div>

<script>
    const API_URL = '/api/shipment';

    // 1. حفظ الشحنة
    async function saveShipment() {
        const data = {
            trackingNumber: document.getElementById('trackId').value,
            location: document.getElementById('currentLocation').value,
            status: document.getElementById('generalStatus').value,
            milestones: {
                m1: document.getElementById('m1').checked ? 'completed' : 'pending',
                m2: document.getElementById('m2').checked ? 'completed' : 'pending',
                m3: document.getElementById('m3').checked ? 'completed' : 'pending',
                m4: document.getElementById('m4').checked ? 'completed' : 'pending',
                m5: document.getElementById('m5').checked ? 'completed' : 'pending',
                m6: document.getElementById('m6').checked ? 'completed' : 'pending'
            }
        };

        if(!data.trackingNumber) return alert('أدخل رقم الشحنة');

        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if(response.ok) {
            alert('تم الحفظ بنجاح');
            location.reload();
        }
    }

    // 2. جلب الشحنات وعرضها
    async function loadShipments() {
        const response = await fetch('/api/shipments');
        const shipments = await response.json();
        const table = document.getElementById('shipmentsTable');
        table.innerHTML = '';

        shipments.forEach(s => {
            // حساب عدد المراحل المكتملة
            const completedCount = Object.values(s.milestones || {}).filter(v => v === 'completed').length;
            
            table.innerHTML += `
                <tr>
                    <td><strong>${s.id}</strong></td>
                    <td>${s.location || 'غير محدد'}</td>
                    <td><span class="status-badge">${completedCount} / 6 مراحل</span></td>
                    <td>
                        <button onclick="deleteShipment('${s.id}')" class="delete-btn"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });
    }

    // 3. حذف شحنة
    async function deleteShipment(id) {
        if(confirm('هل أنت متأكد من الحذف؟')) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            loadShipments();
        }
    }

    window.onload = loadShipments;
</script>

</body>
</html>
