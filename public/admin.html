<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم | النجم الحديث</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root {
--primary-color:#2b5c6a;
--secondary-color:#f16736;
--bg-color:#f4f8fb;
--sidebar-bg:#1a3c46;
--text-light:#fff;
}

body{
font-family:'Tajawal';
background:var(--bg-color);
margin:0;
display:flex;
height:100vh;
}

#login-container{
margin:auto;
background:#fff;
padding:30px;
border-radius:12px;
}

#dashboard-container{display:none;width:100%}

.sidebar{
width:250px;
background:var(--sidebar-bg);
color:#fff;
display:flex;
flex-direction:column;
}

.sidebar a{
padding:15px;
color:#ccc;
cursor:pointer;
display:block;
}

.sidebar a.active{background:#2b5c6a;color:#fff}

.main{flex:1;padding:20px;overflow:auto}

.card{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:10px;
}

.btn{padding:8px 12px;cursor:pointer}

.milestone{padding:8px;margin:5px 0;border-radius:6px}
.done{background:#d4edda}
.pending{background:#eee}

.toast{
position:fixed;
bottom:20px;
left:20px;
background:#2b5c6a;
color:#fff;
padding:10px;
display:none;
}
</style>
</head>

<body>

<div id="login-container">
<h3>دخول</h3>
<input id="loginUser" placeholder="user"><br><br>
<input id="loginPass" type="password" placeholder="pass"><br><br>
<button onclick="login()">دخول</button>
</div>

<div id="dashboard-container">

<div class="sidebar">
<a onclick="tab('dashboard')" class="active">الرئيسية</a>
<a onclick="tab('shipments')">الشحنات</a>
<a onclick="tab('clients')">العملاء</a>
</div>

<div class="main">

<div id="dashboard" class="card">
<h3>إحصائيات</h3>
<p>الشحنات: <span id="sCount"></span></p>
<p>الأخبار: <span id="nCount"></span></p>
</div>

<div id="shipments" class="card" style="display:none">
<h3>الشحنات</h3>

<input id="search" placeholder="بحث" onkeyup="search()"><br><br>

<input id="track" placeholder="رقم"><br>
<select id="status">
<option>Loading at Origin Warehouse</option>
<option>Gated-in at Ningbo Port</option>
<option>Loaded on Board</option>
<option>Arrived at Aden</option>
<option>Customs Cleared</option>
<option>Delivered to Aden Warehouse</option>
</select><br>

<button onclick="addShipment()">حفظ</button>

<table id="table"></table>
</div>

<div id="clients" class="card" style="display:none">
<h3>العملاء</h3>

<input id="cname" placeholder="اسم"><br>
<input id="ccont" placeholder="الحاوية"><br>
<button onclick="addClient()">إضافة</button>
<button onclick="exportCSV()">تصدير</button>

<table id="ctable"></table>
</div>

</div>
</div>

<div id="toast" class="toast"></div>

<script>

const USER="admin",PASS="123";

function login(){
if(loginUser.value===USER && loginPass.value===PASS){
login-container.style.display='none';
dashboard-container.style.display='flex';
load();
}else alert("خطأ");
}

function tab(id){
document.querySelectorAll('.main>div').forEach(d=>d.style.display='none');
document.getElementById(id).style.display='block';
}

let shipments=JSON.parse(localStorage.shipments||"[]");
let clients=JSON.parse(localStorage.clients||"[]");

function addShipment(){
shipments.push({id:track.value,status:status.value});
localStorage.shipments=JSON.stringify(shipments);
toast("تم");
render();
checkNotify(track.value,status.value);
}

function render(){
table.innerHTML="";
shipments.forEach(s=>{
table.innerHTML+=`
<tr>
<td>${s.id}</td>
<td>${s.status}</td>
<td>${milestonesHTML(s.status)}</td>
</tr>`;
});
sCount.innerText=shipments.length;
}

function milestonesHTML(status){
const steps=[
"Loading at Origin Warehouse",
"Gated-in at Ningbo Port",
"Loaded on Board",
"Arrived at Aden",
"Customs Cleared",
"Delivered to Aden Warehouse"
];

let i=steps.indexOf(status);
return steps.map((s,idx)=>
`<div class="milestone ${idx<=i?'done':'pending'}">${s}</div>`
).join('');
}

function search(){
let v=search.value.toLowerCase();
table.innerHTML="";
shipments.filter(s=>s.id.includes(v)).forEach(s=>{
table.innerHTML+=`<tr><td>${s.id}</td><td>${s.status}</td></tr>`;
});
}

function addClient(){
clients.push({n:cname.value,c:ccont.value});
localStorage.clients=JSON.stringify(clients);
renderClients();
toast("تم");
}

function renderClients(){
ctable.innerHTML="";
clients.forEach(c=>{
ctable.innerHTML+=`<tr><td>${c.n}</td><td>${c.c}</td></tr>`;
});
}

function exportCSV(){
let csv="name,container\n";
clients.forEach(c=>csv+=`${c.n},${c.c}\n`);
let a=document.createElement('a');
a.href=URL.createObjectURL(new Blob([csv]));
a.download="clients.csv";
a.click();
}

function checkNotify(container,status){
if(status==="Delivered to Aden Warehouse"){
clients.filter(c=>c.c===container)
.forEach(c=>console.log("notify:",c.n));
}
}

function toast(msg){
let t=document.getElementById('toast');
t.innerText=msg;
t.style.display='block';
setTimeout(()=>t.style.display='none',2000);
}

function load(){
render();
renderClients();
}

</script>
</body>
</html>
