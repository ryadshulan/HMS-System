<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النجم الحديث | تتبع الشحنات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #2b5c6a;
            --secondary-color: #f16736;
            --success-color: #27ae60;
            --bg-color: #f4f8fb;
            --gray-light: #e0e0e0;
        }

        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); margin: 0; padding-top: 90px; }

        /* الهيدر (كما هو في تصميمك الأصلي) */
        .navbar { position: fixed; top: 0; right: 0; left: 0; height: 90px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; padding: 0 5%; z-index: 1000; }
        .navbar .logo img { height: 60px; }
        .navbar nav ul { list-style: none; display: flex; gap: 25px; }
        .navbar nav a { text-decoration: none; color: var(--primary-color); font-weight: 700; }

        /* منطقة التتبع */
        .hero-section { text-align: center; padding: 60px 20px; background: linear-gradient(180deg, #e3f0f5 0%, #f4f8fb 100%); }
        .hero-section h1 { color: var(--primary-color); font-size: 2.5rem; margin-bottom: 20px; }

        .tracking-box { max-width: 600px; margin: 0 auto; background: #fff; padding: 10px; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; }
        .tracking-box input { flex: 1; border: none; outline: none; padding: 15px 25px; font-size: 16px; border-radius: 50px; font-family: inherit; }
        .tracking-box button { background: var(--primary-color); color: white; border: none; padding: 15px 30px; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tracking-box button:hover { background: var(--secondary-color); }

        /* تصميم مراحل التتبع (Milestones) */
        .tracking-container { max-width: 800px; margin: 40px auto; padding: 20px; }
        
        .milestone { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 0; position: relative; padding-bottom: 30px; }
        
        /* الخط الواصل بين المراحل */
        .milestone:not(:last-child)::after {
            content: ''; position: absolute; right: 25px; top: 50px; width: 3px; height: calc(100% - 40px); background: var(--gray-light); z-index: 1;
        }
        .milestone.completed:not(:last-child)::after { background: var(--success-color); }

        .milestone-icon {
            width: 50px; height: 50px; border-radius: 50%; background: var(--gray-light); color: white;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem; z-index: 2; flex-shrink: 0; transition: 0.4s;
        }

        .milestone-content { background: white; padding: 15px 20px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); flex-grow: 1; border-right: 5px solid var(--gray-light); }

        .milestone-title { font-weight: 900; margin-bottom: 5px; color: #777; }
        .milestone-desc { font-size: 0.9rem; color: #999; }

        /* حالات الألوان */
        .milestone.completed .milestone-icon { background: var(--success-color); box-shadow: 0 0 15px rgba(39, 174, 96, 0.3); }
        .milestone.completed .milestone-content { border-right-color: var(--success-color); }
        .milestone.completed .milestone-title { color: var(--primary-color); }
        .milestone.completed .milestone-desc { color: #555; }

        .milestone.in-progress .milestone-icon { background: var(--secondary-color); animation: pulse 2s infinite; }
        .milestone.in-progress .milestone-content { border-right-color: var(--secondary-color); }
        .milestone.in-progress .milestone-title { color: var(--secondary-color); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(241, 103, 54, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(241, 103, 54, 0); }
            100% { box-shadow: 0 0 0 0 rgba(241, 103, 54, 0); }
        }

        #resultArea { display: none; margin-top: 30px; }
        .container-info { text-align: center; margin-bottom: 30px; color: var(--primary-color); }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"><img src="uploads/شعار النجم الحديث.jpg" alt="النجم الحديث"></div>
        <nav>
            <ul>
                <li><a href="#">الرئيسية</a></li>
                <li><a href="#services">الخدمات</a></li>
                <li><a href="#about">من نحن</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero-section">
        <h1>تتبع شحنتك المباشر</h1>
        <div class="tracking-box">
            <input type="text" id="trackingInput" placeholder="أدخل رقم الحاوية (مثلاً: HMSU-123456)...">
            <button onclick="startTracking()">تتبع الآن</button>
        </div>

        <div id="resultArea" class="tracking-container">
            <div class="container-info">
                <h2 id="displayID">رقم الحاوية: ---</h2>
                <p>آخر تحديث: <span id="updateDate">اليوم</span></p>
            </div>
            <div id="milestonesWrapper">
                </div>
        </div>
    </section>

    <script>
        const milestoneData = [
            { id: 'm1', title: 'مخازن الصين', icon: 'fa-warehouse', pending: 'جاري تجهيز وتحميل الشحنة في المستودعات', completed: 'تم التحميل في مستودعات الصين' },
            { id: 'm2', title: 'ميناء نينغبو', icon: 'fa-truck-loading', pending: 'جاري نقل الحاوية إلى ميناء نينغبو', completed: 'وصلت الحاوية إلى ميناء نينغبو (Gate-In)' },
            { id: 'm3', title: 'التحميل للباخرة', icon: 'fa-ship', pending: 'جاري التحميل على متن السفينة', completed: 'تم التحميل ومغادرة السفينة' },
            { id: 'm4', title: 'وصول عدن', icon: 'fa-anchor', pending: 'الشحنة في الطريق إلى ميناء عدن', completed: 'وصلت السفينة إلى ميناء عدن' },
            { id: 'm5', title: 'التخليص الجمركي', icon: 'fa-file-contract', pending: 'بدء إجراءات التخليص الجمركي', completed: 'تم الإفراج الجمركي عن الشحنة' },
            { id: 'm6', title: 'مستودع عدن', icon: 'fa-check-circle', pending: 'جاري النقل إلى المستودع النهائي', completed: 'تم الاستلام في مستودعات عدن' }
        ];

        async function startTracking() {
            const containerID = document.getElementById('trackingInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            const wrapper = document.getElementById('milestonesWrapper');

            if (!containerID) return alert('يرجى إدخال رقم الحاوية');

            // محاكاة جلب البيانات من LocalStorage (التي أضفتها من الأدمن)
            const savedShipments = JSON.parse(localStorage.getItem('hms_shipments')) || {};
            const shipmentStatus = savedShipments[containerID];

            if (!shipmentStatus) {
                alert('عذراً، لم يتم العثور على بيانات لهذه الحاوية.');
                resultArea.style.display = 'none';
                return;
            }

            document.getElementById('displayID').innerText = "رقم الحاوية: " + containerID;
            wrapper.innerHTML = '';
            resultArea.style.display = 'block';

            milestoneData.forEach((step) => {
                const status = shipmentStatus[step.id]; // 'pending' or 'completed'
                let stateClass = '';
                let descText = step.pending;

                if (status === 'completed') {
                    stateClass = 'completed';
                    descText = step.completed;
                } else if (isCurrentStep(shipmentStatus, step.id)) {
                    stateClass = 'in-progress';
                    descText = step.pending;
                }

                wrapper.innerHTML += `
                    <div class="milestone ${stateClass}">
                        <div class="milestone-icon"><i class="fas ${step.icon}"></i></div>
                        <div class="milestone-content">
                            <div class="milestone-title">${step.title}</div>
                            <div class="milestone-desc">${descText}</div>
                        </div>
                    </div>
                `;
            });
        }

        // وظيفة لتحديد المرحلة الحالية (أول مرحلة pending بعد مراحل مكتملة)
        function isCurrentStep(statusObj, currentId) {
            const keys = ['m1', 'm2', 'm3', 'm4', 'm5', 'm6'];
            for (let key of keys) {
                if (statusObj[key] === 'pending') {
                    return key === currentId;
                }
            }
            return false;
        }
    </script>
</body>
</html>
